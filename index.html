<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      name="description"
      content="AbobaTV - онлайн поиск и просмотр фильмов и сериалов. Подборки, рейтинги, история просмотра и удобная навигация."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AbobaTV - онлайн просмотр фильмов и сериалов" />
    <meta
      property="og:description"
      content="AbobaTV - онлайн поиск и просмотр фильмов и сериалов. Подборки, рейтинги, история просмотра и удобная навигация."
    />

    <!-- Иконка и заголовок -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <title>AbobaTV - онлайн просмотр кино и сериалов</title>

    <!-- Мета-теги для iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AbobaTV" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Шрифт грузим неблокирующе: media="print" заставляет браузер скачать
         файл, не задерживая первую отрисовку, а onload переключает его на
         экран. Из РФ Google Fonts бывает медленным, и раньше страница ждала
         его перед показом. noscript — на случай отключённого JS.

         Иконочных шрифтов здесь больше нет: FontAwesome, Material Icons и
         Material Symbols заменены на SVG-набор Lucide (components/icons/
         AppIcon.vue). Это минус три внешних запроса и минус три шрифта. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
      />
    </noscript>

    <!-- Тема PWA -->
    <meta name="theme-color" content="#000000" />
    <script>
      ;(() => {
        const baseUrl = '%BASE_URL%'
        const normalizedBase = baseUrl.endsWith('/') ? baseUrl.slice(0, -1) : baseUrl
        const currentUrl = new URL(window.location.href)
        const redirectPath = currentUrl.searchParams.get('p')

        if (!redirectPath) {
          return
        }

        const restoredPath = decodeURIComponent(redirectPath)
        const remainingParams = new URLSearchParams(currentUrl.searchParams)
        remainingParams.delete('p')

        const searchSuffix = remainingParams.toString()
        const nextUrl = `${normalizedBase}${restoredPath}${searchSuffix ? `?${searchSuffix}` : ''}`

        window.history.replaceState(null, '', nextUrl)
      })()
    </script>
  </head>
  <body>
    <h1 style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">
      AbobaTV - онлайн просмотр фильмов и сериалов
    </h1>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
